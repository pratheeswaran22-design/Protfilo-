<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>G Pratheeswaran | Portfolio</title>
<meta name="description" content="Portfolio of G Pratheeswaran, BSc Computer Science student.">
<style>
:root{--bg:#fff;--text:#1a1a2e;--muted:#5c6070;--card:#f3f4f8;--accent:#4f46e5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root:not([data-theme="light"]){}
[data-theme="dark"]{--bg:#0f1020;--text:#ecebff;--muted:#a3a6c0;--card:#1a1b33;--accent:#8b87ff;color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:70px;background:var(--bg)}
body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);line-height:1.6;transition:background .3s,color .3s}
section{max-width:900px;margin:0 auto;padding:5rem 1.25rem}
h2{font-size:1.8rem;margin-bottom:1.5rem}
a{color:var(--accent)}
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;display:flex;justify-content:space-between;align-items:center;padding:.9rem 1.25rem;background:var(--bg);border-bottom:1px solid var(--card)}
.nav .logo{font-weight:700;text-decoration:none;font-size:1.1rem;color:var(--text)}
.nav nav{display:flex;align-items:center;gap:1.1rem}
.nav nav a{text-decoration:none;color:var(--text);font-size:.95rem}
.nav nav a:hover{color:var(--accent)}
#theme-toggle{background:none;border:none;cursor:pointer;font-size:1.2rem}
.hero{min-height:80vh;display:flex;flex-direction:column;justify-content:center;align-items:flex-start}
.eyebrow{color:var(--accent);font-weight:600}
.hero h1{font-size:clamp(2.2rem,8vw,4.5rem);line-height:1.1}
.typing{font-size:1.4rem;color:var(--muted);margin:.75rem 0 1.75rem}
.typing #typed{color:var(--text);font-weight:600}
.cursor{animation:blink 1s infinite;color:var(--accent)}
@keyframes blink{50%{opacity:0}}
.btn{display:inline-block;padding:.7rem 1.4rem;background:var(--accent);color:#fff;border:none;border-radius:8px;font-size:1rem;text-decoration:none;cursor:pointer;transition:transform .15s,opacity .15s}
.btn:hover{transform:translateY(-2px);opacity:.9}
[data-theme="dark"] .btn{color:#0f1020}
.skills{display:flex;flex-wrap:wrap;gap:.6rem;list-style:none;margin-top:1.25rem}
.skills li{background:var(--card);padding:.35rem .9rem;border-radius:999px;font-size:.9rem}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:1.25rem}
.card{background:var(--card);border-radius:12px;padding:1.4rem;transition:transform .2s,opacity .6s}
.card:hover{transform:translateY(-4px)}
.card h3{margin-bottom:.4rem}
.card p{color:var(--muted);font-size:.95rem;margin-bottom:.9rem}
.tags{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:.9rem}
.tags span{font-size:.75rem;color:var(--accent);border:1px solid var(--accent);border-radius:999px;padding:.1rem .6rem}
form{display:flex;flex-direction:column;gap:.9rem;max-width:520px}
input,textarea{padding:.8rem;border-radius:8px;border:1px solid var(--muted);background:var(--bg);color:var(--text);font:inherit}
input:focus,textarea:focus{outline:2px solid var(--accent);border-color:transparent}
form .btn{align-self:flex-start}
#form-status{color:var(--accent);min-height:1.5em}
footer{text-align:center;padding:2rem 1rem;color:var(--muted);font-size:.9rem}
.reveal{opacity:0;transform:translateY(20px);transition:opacity .6s,transform .6s}
.reveal.visible{opacity:1;transform:none}
@media(max-width:520px){.nav nav{gap:.7rem}.nav nav a{font-size:.85rem}.nav .logo{font-size:1rem}}
</style>
</head>
<body>
<header class="nav">
  <a href="#home" class="logo">G Pratheeswaran</a>
  <nav>
    <a href="#about">About</a>
    <a href="#projects">Projects</a>
